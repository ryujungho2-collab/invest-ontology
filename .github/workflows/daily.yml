name: daily-ontology

on:
  schedule:
    - cron: '0 22 * * 1-5'   # UTC 22:00 = 한국 오전 7시 (미국 장 마감 후, 월~금)
  workflow_dispatch:          # Actions 탭에서 수동 실행 가능

permissions:
  contents: write             # 갱신된 노트를 저장소에 커밋하기 위해 필요

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: 파이프라인 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pipeline/run.py
      - name: 노트 커밋
        run: |
          git config user.name "ontology-bot"
          git config user.email "ontology-bot@users.noreply.github.com"
          git add vault docs
          git commit -m "briefing $(date -u +%Y-%m-%d)" || echo "변경 없음"
          git push
